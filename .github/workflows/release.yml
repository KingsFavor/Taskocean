name: Release

# Notarized Developer ID build + DMG + GitHub Release + Homebrew Cask bump.
# Track B in docs/release.md. Triggered by pushing a version tag (v1.2.3) or manually.
#
# Required repository secrets (see docs/ci_release.md):
#   BUILD_CERTIFICATE_BASE64  base64 of the "Developer ID Application" .p12
#   P12_PASSWORD              password protecting that .p12
#   KEYCHAIN_PASSWORD         any string; password for the throwaway CI keychain
#   AC_API_KEY_ID             App Store Connect API key ID (for notarytool)
#   AC_API_ISSUER_ID          App Store Connect API issuer ID
#   AC_API_KEY_BASE64         base64 of the App Store Connect API .p8 private key
#   TAP_GITHUB_TOKEN          PAT with write access to KingsFavor/homebrew-tap

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0). Defaults to the pushed tag."
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build, notarize & release
    runs-on: macos-14
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.sha.outputs.sha256 }}
    env:
      TEAM_ID: "4S9VPFZ465"
      SCHEME: "TaskOcean"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version & build number
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then echo "::error::Could not resolve version"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building TaskOcean $VERSION (build ${GITHUB_RUN_NUMBER})"

      - name: Import Developer ID signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dev_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Make the CI keychain searchable while keeping the login keychain too.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive (Developer ID)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project TaskOcean.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/TaskOcean.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"
          test -d "$RUNNER_TEMP/TaskOcean.xcarchive"

      - name: Export archive
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TaskOcean.xcarchive" \
            -exportOptionsPlist ExportOptions-developerid.plist \
            -exportPath "$RUNNER_TEMP/export"
          test -d "$RUNNER_TEMP/export/TaskOcean.app"

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/TaskOcean.app"
          STAGING="$RUNNER_TEMP/dmg-staging"
          DMG="$RUNNER_TEMP/TaskOcean-$VERSION.dmg"
          rm -rf "$STAGING"; mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "TaskOcean" -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG"
          # Sign the DMG itself so the notarization ticket staples cleanly.
          codesign --force --sign "Developer ID Application" --timestamp "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize & staple
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/ac_api_key.p8"
          echo -n "$AC_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG" || true

      - name: Compute SHA256
        id: sha
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA" > "$RUNNER_TEMP/sha256.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(cat "$RUNNER_TEMP/sha256.txt")
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Notarized Developer ID build."
            echo ""
            echo "**SHA-256:** \`$SHA\`"
          } > "$NOTES"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$DMG" --clobber
          else
            gh release create "v$VERSION" "$DMG" \
              --title "TaskOcean $VERSION" \
              --notes-file "$NOTES"
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  update-homebrew-tap:
    name: Update Homebrew Cask
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for cask template)
        uses: actions/checkout@v4

      - name: Render & push cask to tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_GITHUB_TOKEN not set — skipping Homebrew tap update."
            echo "Publish manually with the values in docs/ci_release.md."
            exit 0
          fi
          if [ -z "${SHA256:-}" ]; then
            echo "::error::Missing sha256 from build job"; exit 1
          fi
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__SHA256__|${SHA256}|g" \
              .github/templates/taskocean.rb > /tmp/taskocean.rb
          echo "Rendered cask:"; cat /tmp/taskocean.rb

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/KingsFavor/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp /tmp/taskocean.rb tap/Casks/taskocean.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git add Casks/taskocean.rb
          git commit -m "taskocean ${VERSION}"
          git push
